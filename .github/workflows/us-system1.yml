name: US equity data checks
on:
  push:
    branches: [research/us-system1-2010-2026]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install pandas pyarrow requests
      - run: python -u research/us_equity_sources.py
