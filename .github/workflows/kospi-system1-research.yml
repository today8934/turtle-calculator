name: KOSPI SMA100 entry and exposure comparison
on:
  push:
    branches: [research/kospi-system1-20261127]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [high_first, low_first, near_first]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip -q install 'pandas>=2.2,<3' pyarrow numpy
      - name: Download pinned public market data
        run: |
          mkdir -p market output
          for year in {2008..2019}; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/FinanceData/marcap/ad832658580379c20b8f605797afb10ecfcc690f/data/marcap-$year.parquet" -o "market/$year.parquet"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/259713bf397e5e28fb0da531a19b78a3ca15766b/data/index/year_ks11/$year.csv" -o "market/$year.csv"
          done
      - name: Simulate annual accounts on the selected path
        run: python -u research/turtle_intraday_years.py ${{ matrix.path }} --sma100
      - uses: actions/upload-artifact@v4
        with:
          name: transactions-${{ matrix.path }}
          path: output/
      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.path }}
          path: |
            output/sma100_${{ matrix.path }}.csv
            output/sma100_days.csv
  compare:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip -q install 'pandas>=2.2,<3' numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: output
          merge-multiple: true
      - run: python -u research/turtle_intraday_years.py combine --sma100
      - uses: actions/upload-artifact@v4
        with:
          name: kospi-sma100-2010-2019
          path: |
            output/sma100_results.csv
            output/sma100_days.csv
