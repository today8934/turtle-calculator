name: KOSPI System 1 research
on:
  push:
    branches: [research/kospi-system1-20261127]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip -q install 'pandas>=2.2,<3' pyarrow numpy
      - name: Download pinned public market data
        run: |
          mkdir -p market output
          for year in 2024 2025 2026; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/FinanceData/marcap/ad832658580379c20b8f605797afb10ecfcc690f/data/marcap-$year.parquet" -o "market/$year.parquet"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/259713bf397e5e28fb0da531a19b78a3ca15766b/data/index/year_ks11/$year.csv" -o "market/$year.csv"
          done
      - name: Validate data and run simulation
        run: python -u research/kospi_system1.py
      - uses: actions/upload-artifact@v4
        with:
          name: kospi-system1-results
          path: output/
          if-no-files-found: ignore
