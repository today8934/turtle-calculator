name: Verify intraday holdings
on:
  push:
    branches: [research/kospi-system1-20261127]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 46114396447
          github-token: ${{ github.token }}
          pattern: transactions-*
          merge-multiple: true
          path: output
      - name: Read corporate actions and execution costs
        run: |
          python - <<'PY'
          import csv,glob,collections
          from pathlib import Path
          agg=collections.defaultdict(list)
          for p in glob.glob('output/*_fills.csv'):
              stem=Path(p).stem
              cost=0
              with open(p) as f:
                  for r in csv.DictReader(f):
                      if int(r['phase'])<0:
                          print('REMOVAL',stem,r['date'],r['code'],r.get('side'),r['raw_shares'])
                      cost+=float(r['raw_price'])*float(r['raw_shares'])*(.0005 if r['action']=='buy' else .0025)
              if 'near_first_' in stem:
                  variant,year,n=stem.removesuffix('_fills').removeprefix('near_first_').rsplit('_',2)
                  agg[(variant,n)].append(cost/1e6)
          for k,x in sorted(agg.items()):
              print('MEAN_COST',k,round(sum(x)/len(x),4))
          PY
