name: Verify published calculator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/verify-pages.yml, .github/tests/portfolio.mjs]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test client
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - name: Verify portfolio persistence and calculations in Chrome
        env:
          LIVE_URL: https://today8934.github.io/turtle-calculator/
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/turtle-http.log 2>&1 &
            trap 'kill "$!" 2>/dev/null || true' EXIT
            SITE_URL=http://127.0.0.1:8787/
            curl --retry 8 --retry-connrefused --retry-delay 1 --silent --fail "$SITE_URL" -o /dev/null
          else
            SITE_URL="${LIVE_URL}?check=${RUN_ID}"
          fi
          export SITE_URL
          node .github/tests/portfolio.mjs
      - name: Exercise the live page when it matches this revision
        if: github.event_name == 'push'
        env:
          SITE_URL: https://today8934.github.io/turtle-calculator/?check=${{ github.run_id }}
        run: |
          curl --fail --silent --show-error --retry 3 "$SITE_URL" -o /tmp/turtle-published.html
          if cmp -s index.html /tmp/turtle-published.html; then
            node .github/tests/portfolio.mjs
          else
            echo "Production still serves a different revision."
          fi
